<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>بيتنا · Our Home</title>
    <meta name="description" content="لوحة تحكم منزلية مشتركة لنا نحن الاثنين" />
    <meta name="theme-color" content="#F5F1EB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1013" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="بيتنا" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Apply saved theme before first paint to avoid flashes.
      (function () {
        try {
          var t = localStorage.getItem('oh.theme') || 'auto';
          var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
